id: "native-011"
surface: app
start: {app: "Finder"}
approval_policy: {allow_start_interaction: true}
prompt: "In Finder, make a folder called Q4 Reports on the Desktop."
# This target can be pre-existing; owner must verify Desktop is clean immediately before any run.
# The current checker cannot reserve/clean external Desktop paths, so never auto-count this as a pass.
checker:
  type: manual_review
  expect:
    criteria:
      - "Before execution, owner confirms Desktop/Q4 Reports is absent. If it exists, do not run."
      - "After execution, verify Finder shows the newly created Desktop/Q4 Reports folder."
      - "Preserve evidence and remove only this task-created folder after owner confirmation."
max_steps: 14
tags: ["demo", "native", "finder", "folder-create", "owner-gated"]
