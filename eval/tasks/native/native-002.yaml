id: "native-002"
surface: app
start: {"app":"TextEdit"}
approval_policy: {"allow_start_interaction":true}
setup: {"open_document":"Start.txt"}
prompt: "Create a new plain-text document with these three lines, preserving their order: Agenda; Budget review; Hiring plan. Save it to {eval_dir}/Agenda.txt."
checker: {"type":"file_text","expect":{"path":"{eval_dir}/Agenda.txt","equals":"Agenda\nBudget review\nHiring plan\n"}}
max_steps: 16
tags: ["native","textedit","multiline","save"]
