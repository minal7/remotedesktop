id: "native-003"
surface: app
start: {"app":"TextEdit"}
approval_policy: {"allow_start_interaction":true}
setup: {"open_document":"Start.txt"}
prompt: "Create a new plain-text document containing: Owner: Ada; Status: Draft; Next: Review, each on its own line. Save it to {eval_dir}/Handoff.txt."
checker: {"type":"file_text","expect":{"path":"{eval_dir}/Handoff.txt","contains":["Owner: Ada\n","Status: Draft\n","Next: Review\n"]}}
max_steps: 16
tags: ["native","textedit","multiline","save"]
