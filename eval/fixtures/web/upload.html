<!doctype html><meta charset="utf-8"><title>File upload controls</title>
<main><h1>Attach a document</h1><label for="upload">Choose a file</label><input id="upload" type="file"><div id="drop-zone" role="button" tabindex="0">Drop a file here</div><p id="file-name"></p>
<script>document.querySelector('#upload').addEventListener('change',e=>document.querySelector('#file-name').textContent=e.target.files[0]?.name||'');document.querySelector('#drop-zone').addEventListener('drop',e=>{e.preventDefault();document.querySelector('#file-name').textContent=e.dataTransfer.files[0]?.name||''});document.querySelector('#drop-zone').addEventListener('dragover',e=>e.preventDefault());</script></main>
