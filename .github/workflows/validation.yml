name: Product validation

# Secret-free validation for every change that reaches main and every pull
# request. The full macOS host XCTest target runs in Debug with code signing
# disabled so CI can compile and exercise deterministic host behavior without
# provisioning. Signed release validation remains in the Release workflow.
# This workflow never resolves a release version, signs distribution assets,
# packages installers, creates tags, publishes releases, or writes repository
# contents.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: product-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows host
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo validation build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: host-windows

      - name: Check Rust formatting
        working-directory: host-windows
        run: cargo fmt --all -- --check

      - name: Run Windows host tests
        working-directory: host-windows
        run: cargo test --locked --all-targets

      - name: Build Windows host Release without signing
        working-directory: host-windows
        run: cargo build --release --locked

  apple:
    name: macOS computer-use and iOS
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        # XcodeGen includes the checkout folder name in shared-file group IDs.
        working-directory: remote desktop
    env:
      # macos-15 defaults /Applications/Xcode.app to an older toolchain. Keep
      # FoundationModels enabled by using the same SDK as the Release gate.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      XCODEGEN_SHA256: 0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878
      XCODEGEN_VERSION: 2.45.3

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          path: remote desktop

      - name: Validate Xcode 26 toolchain
        run: |
          set -euo pipefail

          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.2"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "26.2"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "26.2"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Validate generated macOS project is current
        run: |
          set -euo pipefail

          (cd host-mac && xcodegen generate)
          if ! git diff --exit-code -- host-mac/RemoteDesktopHost.xcodeproj/project.pbxproj; then
            echo "::error::host-mac/project.yml and the checked-in Xcode project differ. Regenerate the project with XcodeGen $XCODEGEN_VERSION and commit it."
            exit 1
          fi

      - name: Prepare pinned universal SQLCipher for clean checkout
        run: |
          set -euo pipefail
          python3 host-mac/scripts/bootstrap_memory_sqlcipher.py --download
          host-mac/scripts/build_memory_sqlcipher.sh

      - name: Regenerate iOS project
        working-directory: remote desktop/ios
        run: xcodegen generate

      - name: Validate paired Apple CloudKit configurations
        run: |
          set -euo pipefail

          ./script/verify_apple_configuration_pair.sh Debug Debug
          ./script/verify_apple_configuration_pair.sh Release Release

      - name: Install Agent contract validator
        run: python3 -m pip install -r host-mac/scripts/agent/requirements.txt

      - name: Validate general Agent contracts
        run: python3 -m unittest discover -s host-mac/scripts/agent -t host-mac/scripts -p 'test_*.py'

      - name: Run deterministic Computer Use harness tests
        run: python3 -m unittest discover -s host-mac/scripts/tests -p 'test_*.py'

      - name: Check hardwiring lint self-test
        run: ./scripts/lint_no_hardwiring.sh --self-test

      - name: Reject new task, site, or app literals in shipping Swift
        env:
          HARDWIRING_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HARDWIRING_BASE_SHA"
          ./scripts/lint_no_hardwiring.sh "$HARDWIRING_BASE_SHA"

      - name: Validate reviewed Mac acceptance inventory
        run: |
          python3 host-mac/scripts/verify_test_inventory.py \
            --manifest host-mac/AcceptanceFixtures/osatlas-deterministic-tests.json \
            --source-root .

      - name: Run full macOS host Debug tests without signing
        run: |
          set -euo pipefail
          # Exercise the real app-hosted XCTest target. One test worker keeps
          # process-wide Vision initialization stable; individual tests have
          # a bounded 90-second execution allowance. The build phase verifies
          # the pinned runtime but intentionally skips signing in this CI path.
          xcodebuild test \
            -project host-mac/RemoteDesktopHost.xcodeproj \
            -scheme RemoteDesktopHost \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/mac-host-derived-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -resultBundlePath "$RUNNER_TEMP/mac-host-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xcresult" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            -jobs 1 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 90 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Summarize failed macOS host tests
        if: ${{ failure() }}
        run: |
          set -euo pipefail

          result_bundle="$RUNNER_TEMP/mac-host-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xcresult"
          summary_file="$RUNNER_TEMP/mac-host-tests-summary.json"
          if [[ ! -d "$result_bundle" ]]; then
            echo "No macOS host xcresult bundle was produced."
            exit 0
          fi
          xcrun xcresulttool get test-results summary \
            --path "$result_bundle" \
            --format json > "$summary_file"
          # Keep Actions logs readable; the complete summary and xcresult are
          # uploaded below for diagnosis.
          head -c 12000 "$summary_file"

      - name: Upload macOS host test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-host-xcresult-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mac-host-tests-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
            ${{ runner.temp }}/mac-host-tests-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail

          simulator_udid="$(python3 - <<'PY'
          import json
          import re
          import subprocess

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in re.findall(r"\d+", runtime))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone Simulator was found")
          print(max(candidates)[2])
          PY
          )"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Run Debug iOS diagnostic unit tests
        run: |
          set -euo pipefail

          xcodebuild test \
            -project ios/RemoteDesktop.xcodeproj \
            -scheme RemoteDesktop \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/ios-debug-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xcresult" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -quiet

          # Actual-model, live desktop, TCC, production CloudKit, and signed
          # host checks remain prepared-machine or Release acceptance gates.

      - name: Summarize failed iOS Debug tests
        if: ${{ failure() }}
        run: |
          set -euo pipefail

          result_bundle="$RUNNER_TEMP/ios-debug-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xcresult"
          if [[ ! -d "$result_bundle" ]]; then
            echo "No iOS Debug xcresult bundle was produced."
            exit 0
          fi
          xcrun xcresulttool get test-results summary \
            --path "$result_bundle" \
            --format json

      - name: Upload failed iOS Debug test result
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-debug-xcresult-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-debug-tests-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          if-no-files-found: ignore
          retention-days: 7
